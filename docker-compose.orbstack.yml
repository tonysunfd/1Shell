services:
  1shell:
    build:
      context: .
    container_name: 1shell
    restart: unless-stopped
    ports:
      - "${PORT:-3301}:${PORT:-3301}"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./server.js:/app/server.js:ro
      - ./src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - NODE_ENV=production
